name: SI8 CRC Raw-IP Retention

# SI8-PRIVACY-CRC-1B — daily 30-day retention for crc_pilot_events.raw_ip (PROPOSED). Calls the app's secret-protected endpoint;
# the database function (migration 20261118000000) clears raw_ip on events older than 30 days and keeps the rows. A non-2xx
# response fails this job (GitHub notifies on failed scheduled runs). GitHub scheduled runs are best-effort and may be delayed.
#
# Requires repository secret CRC_RAW_IP_RETENTION_SWEEP_SECRET (>= 32 chars), identical to the environment variable of the same
# name on the Vercel production project for app.superimmersive8.com, and migration 20261118000000 applied. Until then the endpoint
# refuses and this job fails.
#
# ACTIVATION GATE: disabled by default. Runs only when the repository variable CRC_RAW_IP_RETENTION_ENABLED is exactly `true`
# (lower case, nothing else); the comparison is made in the shell by the `gate` job, which references no secret (GitHub expression
# equality is case-insensitive). Scheduled and manual runs go through the same gate. The first Production run clears every
# raw_ip older than 30 days and needs separate founder authorization before the variable is set.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: crc-raw-ip-retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.decide.outputs.enabled }}
    steps:
      - name: Check the activation variable
        id: decide
        env:
          CRC_RAW_IP_RETENTION_ENABLED_VALUE: ${{ vars.CRC_RAW_IP_RETENTION_ENABLED }}
        run: |
          if [ "${CRC_RAW_IP_RETENTION_ENABLED_VALUE}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CRC raw-IP retention is disabled (CRC_RAW_IP_RETENTION_ENABLED is not exactly 'true'); skipping."
          fi

  sweep:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run CRC raw-IP retention
        env:
          CRC_RAW_IP_RETENTION_SWEEP_SECRET: ${{ secrets.CRC_RAW_IP_RETENTION_SWEEP_SECRET }}
        run: |
          if [ -z "$CRC_RAW_IP_RETENTION_SWEEP_SECRET" ]; then
            echo "::error::CRC_RAW_IP_RETENTION_SWEEP_SECRET is not configured"
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRC_RAW_IP_RETENTION_SWEEP_SECRET}" \
            https://app.superimmersive8.com/api/internal/crc/raw-ip-retention
