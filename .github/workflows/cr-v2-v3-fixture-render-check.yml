name: CR-V2 v3 Fixture Render Check (free, no secret)

# CRV2-IA-4D3 S3-PUBLIC-1 — proves on Linux, with no secret and no model call, that the committed synthetic fixtures render to the
# committed pinned hashes and that the v3 evaluation's free dry run accepts all 56 public documents. It must pass before the paid
# workflow (cr-v2-v3-issuer-evidence-evaluation.yml) is dispatched; the paid workflow repeats the same checks itself.
#
#   - No secret is referenced anywhere in this file. Read-only token, no persisted git credentials, no install scripts.
#   - Runs on pushes to main that touch the fixtures or the evaluation code, or manually; every third-party action pinned to a SHA.
#   - Nothing is uploaded. Logs show fixture ids, hashes, counts and versions only.

on:
  push:
    branches: [main]
    paths:
      - '08_Platform/app/lib/creator-record/eval/**'
      - '08_Platform/app/lib/creator-record/receipt-examination/**'
      - '.github/workflows/cr-v2-v3-fixture-render-check.yml'
      - '.github/workflows/cr-v2-v3-issuer-evidence-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cr-v2-v3-fixture-render-check
  cancel-in-progress: true

jobs:
  render-check:
    if: github.repository == 'aip-jd36/superimmersive8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: 08_Platform/app

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 08_Platform/app/package-lock.json

      - name: Install Node dependencies (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install the fixture generator's dependencies (the versions the fixtures were pinned with)
        run: |
          python -m pip install --no-cache-dir --only-binary=:all: "pymupdf==1.27.2.3" "pillow==12.2.0"

      - name: Render the synthetic fixtures on Linux
        run: |
          set -euo pipefail
          python -I lib/creator-record/eval/fixtures/generate_receipt_fixtures.py
          cd lib/creator-record/eval/fixtures
          python -I generate_receipt_fixtures.py --spec issuer-evidence-fixtures.json --out generated/issuer-evidence

      - name: Compare the rendered documents with the committed pins
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const dir = 'lib/creator-record/eval/fixtures'
          const pins = JSON.parse(fs.readFileSync(`${dir}/issuer-evidence-fixtures.document-hashes.json`, 'utf8'))
          const m = JSON.parse(fs.readFileSync(`${dir}/generated/issuer-evidence/manifest.json`, 'utf8'))
          const v1 = JSON.parse(fs.readFileSync(`${dir}/history/receipt-fixtures-v1.document-hashes.json`, 'utf8')).documents
          const base = JSON.parse(fs.readFileSync(`${dir}/generated/manifest.json`, 'utf8'))
          const bad = []
          for (const d of m.documents) {
            const ok = pins.documents[d.id] === d.sha256
            console.log(`${ok ? 'MATCH' : 'DIFFER'} ${d.id} ${d.sha256}`)
            if (!ok) bad.push(d.id)
          }
          if (Object.keys(pins.documents).length !== m.documents.length) bad.push('document count')
          const v1ids = base.documents.filter((d) => v1[d.id])
          const v1ok = v1ids.filter((d) => v1[d.id] === d.sha256).length
          console.log(`Issuer-evidence (${pins.spec_version}): ${m.documents.length - bad.length}/${m.documents.length} match the pins (renderer pymupdf ${m.pymupdf_version}, pillow ${m.pillow_version}; pinned with ${pins.pymupdf_version}/${pins.pillow_version}).`)
          console.log(`Baseline: ${base.documents.length} rendered; ${v1ok}/${v1ids.length} v1-era documents match the frozen v1 hashes.`)
          if (bad.length) { console.error('RENDER CHECK FAILED: ' + bad.join(', ')); process.exit(1) }
          NODE

      - name: Free v3 dry run (no model call, no secret)
        run: |
          set -euo pipefail
          npx tsx lib/creator-record/eval/run-receipt-eval.ts --mode dry-run --contract v3 --set all \
            --input-usd-per-mtok 2 --output-usd-per-mtok 10 --out "$RUNNER_TEMP/dry-run.json"
          node -e "const r=require(process.argv[1]);const ok=r.plan.documents===56&&r.plan.max_api_requests===112&&r.live_input_bound.every(b=>b.admitted)&&r.api_requests_made===0;console.log('dry run:',r.plan.documents,'documents,',r.plan.max_api_requests,'max requests, admitted',r.live_input_bound.filter(b=>b.admitted).length);if(!ok)process.exit(1)" "$RUNNER_TEMP/dry-run.json"
