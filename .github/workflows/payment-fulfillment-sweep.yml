name: SI8 Payment Fulfillment Sweep

# CAA-SECURITY-3B — hourly recovery of failed / abandoned payment fulfillment.
# Calls the app's secret-protected sweep endpoint; all eligibility and retry
# limits are enforced server-side by the payment ledger. A non-2xx response
# fails this job (GitHub notifies on failed scheduled runs).
#
# Requires repository secret PAYMENT_SWEEP_SECRET (>= 32 chars), identical to
# the PAYMENT_SWEEP_SECRET environment variable on the Vercel production
# project for app.superimmersive8.com.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: payment-fulfillment-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run payment fulfillment sweep
        env:
          PAYMENT_SWEEP_SECRET: ${{ secrets.PAYMENT_SWEEP_SECRET }}
        run: |
          if [ -z "$PAYMENT_SWEEP_SECRET" ]; then
            echo "::error::PAYMENT_SWEEP_SECRET is not configured"
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${PAYMENT_SWEEP_SECRET}" \
            https://app.superimmersive8.com/api/internal/payment-fulfillments/sweep
