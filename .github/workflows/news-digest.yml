name: SI8 News Intelligence

on:
  schedule:
    # Every 3 days at 01:00 UTC = 09:00 Taipei time (UTC+8)
    - cron: '0 1 */3 * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      lookback_days:
        description: 'Days to look back for articles'
        required: false
        default: '7'
      dry_run:
        description: 'Dry run (score articles but do not send email)'
        required: false
        default: 'false'
      experiment_recency:
        description: 'SI8-INTEL-NEWS-5B6: also run the diagnostic-only Control-A-vs-Experiment-B (when:7d) retrieval recall comparison. Never affects the customer email; requires explicit true. Default off.'
        required: false
        default: 'false'

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/news-digest/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/news-digest/requirements.txt

      - name: Run digest
        working-directory: tools/news-digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: jd@superimmersive8.com
          DIGEST_FROM_EMAIL: digest@superimmersive8.com
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          EXPERIMENT_FLAG=""
          if [ "${{ github.event.inputs.experiment_recency }}" = "true" ]; then
            EXPERIMENT_FLAG="--experiment-recency"
          fi
          python digest.py --lookback $LOOKBACK_DAYS $DRY_RUN_FLAG $EXPERIMENT_FLAG

      - name: Commit and push digest log (race-safe)
        # SI8-INTEL-NEWS-4B1: the digest run above can take several
        # minutes; origin/main may advance during that window. A plain
        # `git push` here would be rejected (non-fast-forward) whenever
        # that happens -- observed in Production 2026-09-28. This script
        # fetches, rebases onto the current origin/main, and retries a
        # bounded number of times; it never force-pushes and fails
        # visibly (no push) if a concurrent change genuinely conflicts.
        # See tools/news-digest/push_digest_log.sh for full detail.
        run: |
          git config user.name "SI8 Digest Bot"
          git config user.email "digest@superimmersive8.com"
          bash tools/news-digest/push_digest_log.sh
